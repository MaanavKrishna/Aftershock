<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="01 Proof by git history. A test is admitted only if it fails three of three runs on the commit before the fix and passes three of three on the fix. In the sample, commit 3f2a1c9 fails three times and the fix aa86f56 passes three times, so the test is proven and admitted to memory. A model never marks anything proven."><title>01 Proof by git history. A test is admitted only if it fails three of three runs on the commit before the fix and passes three of three on the fix. In the sample, commit 3f2a1c9 fails three times and the fix aa86f56 passes three times, so the test is proven and admitted to memory. A model never marks anything proven.</title><style>@font-face{font-family:'AS Medium';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fb{font-family:'AS Medium',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:500;font-feature-settings:'tnum'}@font-face{font-family:'AS Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'AS Mono',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:400;font-feature-settings:'tnum'}@font-face{font-family:'AS Mono Semibold';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal}.fmb{font-family:'AS Mono Semibold',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:600;font-feature-settings:'tnum'}@font-face{font-family:'AS Mono Medium';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fmm{font-family:'AS Mono Medium',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:500;font-feature-settings:'tnum'}@font-face{font-family:'AS Regular';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fr{font-family:'AS Regular',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:400;font-feature-settings:'tnum'}@font-face{font-family:'AS Semibold';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal}.fs{font-family:'AS Semibold',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:600;font-feature-settings:'tnum'}
@media (prefers-reduced-motion:no-preference){
.fade{animation:fade .8s cubic-bezier(.22,1,.36,1) both}
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1s cubic-bezier(.22,1,.36,1) both}
.draw{stroke-dasharray:1;animation:draw 2.2s cubic-bezier(.45,0,.25,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
</style><defs><clipPath id="clip"><rect width="1140" height="640" rx="24"/></clipPath><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.1" fill="#FFFFFF" fill-opacity=".07"/></pattern><radialGradient id="fade" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="dotmask"><rect width="1140" height="640" fill="url(#fade)"/></mask></defs><g clip-path="url(#clip)"><rect width="1140" height="640" fill="#08090C"/><rect width="1140" height="640" fill="url(#dots)" mask="url(#dotmask)"/><text x="34.0" y="58.0" class="fmb" font-size="16" fill="#828A98" xml:space="preserve" letter-spacing="1.2">01</text><text x="70.0" y="58.0" class="fm" font-size="15" fill="#828A98" xml:space="preserve" letter-spacing="1.8">TIME TRAVEL</text><g transform="translate(32,92)"><line x1="0" y1="236" x2="1076" y2="236" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="40" cy="236" r="6" fill="#1E222A" stroke="#828A98" stroke-width="2"/><circle cx="150" cy="236" r="6" fill="#1E222A" stroke="#828A98" stroke-width="2"/><circle cx="900" cy="236" r="6" fill="#1E222A" stroke="#828A98" stroke-width="2"/><circle cx="1010" cy="236" r="6" fill="#1E222A" stroke="#828A98" stroke-width="2"/><text x="1076.0" y="280.0" class="fm" font-size="13" fill="#828A98" xml:space="preserve" text-anchor="end" letter-spacing="1.6">MAIN →</text><g class="fade" style="animation-delay:0.20s"><rect x="165.0" y="10.0" width="330.0" height="158.0" rx="14" fill="#0F1115" stroke="rgba(255,255,255,.14)"/><path d="M179.0,10.5H481.0" stroke="#FFFFFF" stroke-opacity=".05"/><text x="187.0" y="50.0" class="fmm" font-size="18" fill="#EDEFF3" xml:space="preserve">3f2a1c9</text><text x="187.0" y="76.0" class="fr" font-size="15" fill="#828A98" xml:space="preserve">The commit before the fix</text><g class="pop" style="animation-delay:0.60s"><rect x="187.0" y="102.0" width="36" height="36" rx="8.6" fill="rgba(255,122,69,.13)" stroke="rgba(255,122,69,.36)" stroke-width="1"/><g transform="translate(194.6,109.6) scale(0.8700)"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="#FF7A45" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="pop" style="animation-delay:0.68s"><rect x="229.0" y="102.0" width="36" height="36" rx="8.6" fill="rgba(255,122,69,.13)" stroke="rgba(255,122,69,.36)" stroke-width="1"/><g transform="translate(236.6,109.6) scale(0.8700)"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="#FF7A45" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="pop" style="animation-delay:0.76s"><rect x="271.0" y="102.0" width="36" height="36" rx="8.6" fill="rgba(255,122,69,.13)" stroke="rgba(255,122,69,.36)" stroke-width="1"/><g transform="translate(278.6,109.6) scale(0.8700)"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="#FF7A45" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="473.0" y="126.0" class="fmb" font-size="12" fill="#FF7A45" xml:space="preserve" text-anchor="end" letter-spacing="1.2">FAILED 3/3</text><line x1="330" y1="168" x2="330" y2="224" stroke="#FF7A45" stroke-opacity=".5" stroke-dasharray="3 4"/></g><circle cx="330" cy="236" r="10" fill="#08090C" stroke="#FF7A45" stroke-width="3.5"/><g class="fade" style="animation-delay:0.55s"><rect x="535.0" y="10.0" width="330.0" height="158.0" rx="14" fill="#0F1115" stroke="rgba(255,255,255,.14)"/><path d="M549.0,10.5H851.0" stroke="#FFFFFF" stroke-opacity=".05"/><text x="557.0" y="50.0" class="fmm" font-size="18" fill="#EDEFF3" xml:space="preserve">aa86f56</text><text x="557.0" y="76.0" class="fr" font-size="15" fill="#828A98" xml:space="preserve">fix: reject duplicate pending payment</text><g class="pop" style="animation-delay:0.95s"><rect x="557.0" y="102.0" width="36" height="36" rx="8.6" fill="rgba(61,214,140,.12)" stroke="rgba(61,214,140,.36)" stroke-width="1"/><g transform="translate(564.6,109.6) scale(0.8700)"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="#3DD68C" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="pop" style="animation-delay:1.03s"><rect x="599.0" y="102.0" width="36" height="36" rx="8.6" fill="rgba(61,214,140,.12)" stroke="rgba(61,214,140,.36)" stroke-width="1"/><g transform="translate(606.6,109.6) scale(0.8700)"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="#3DD68C" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="pop" style="animation-delay:1.11s"><rect x="641.0" y="102.0" width="36" height="36" rx="8.6" fill="rgba(61,214,140,.12)" stroke="rgba(61,214,140,.36)" stroke-width="1"/><g transform="translate(648.6,109.6) scale(0.8700)"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="#3DD68C" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="843.0" y="126.0" class="fmb" font-size="12" fill="#3DD68C" xml:space="preserve" text-anchor="end" letter-spacing="1.2">PASSED 3/3</text><line x1="700" y1="168" x2="700" y2="224" stroke="#3DD68C" stroke-opacity=".5" stroke-dasharray="3 4"/></g><circle cx="700" cy="236" r="10" fill="#08090C" stroke="#3DD68C" stroke-width="3.5"/><path class="draw" pathLength="1" d="M1010,254 C1010,320 820,320 700,320 S350,320 330,256" fill="none" stroke="#5EB1FF" stroke-width="2" stroke-dasharray="1" style="animation-delay:.2s"/><path d="M335.7,261.7L330.0,256.0L326.6,263.3" fill="none" stroke="#5EB1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="520.0" y="310.0" class="fmb" font-size="13" fill="#5EB1FF" xml:space="preserve" text-anchor="middle" letter-spacing="1.6">TIME TRAVEL</text><g class="pop" style="animation-delay:1.4s"><rect x="966.8" y="72.2" width="109.2" height="31.5" rx="8.1" fill="rgba(61,214,140,.12)"/><g transform="translate(979.0,79.5) scale(0.7125)"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="#3DD68C" stroke-width="2.82" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1002.8" y="94.5" class="fb" font-size="18" fill="#3DD68C" xml:space="preserve">Proven</text></g><text x="1076.0" y="136.0" class="fr" font-size="16" fill="#A9B0BC" xml:space="preserve" text-anchor="end">admitted to memory</text></g><line x1="34" y1="452" x2="1106" y2="452" stroke="rgba(255,255,255,.08)"/><text x="32.0" y="516.0" class="fs" font-size="46" fill="#EDEFF3" xml:space="preserve" letter-spacing="-1.2">Proof by git history</text><text x="34.0" y="560.0" class="fr" font-size="22" fill="#A9B0BC" xml:space="preserve">A test is admitted only if it fails 3/3 on the commit before the fix</text><text x="34.0" y="594.0" class="fr" font-size="22" fill="#A9B0BC" xml:space="preserve">and passes 3/3 on the fix. A model never marks anything proven.</text></g><rect x=".5" y=".5" width="1139" height="639" rx="23.5" fill="none" stroke="rgba(255,255,255,.14)"/></svg>
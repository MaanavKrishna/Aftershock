<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-label="07 Your code runs isolated. Every run is a fresh microVM: clone with a read-only token for one repository, install dependencies with the network on, cut the network before any test runs, then run the tests three times with no secrets inside."><title>07 Your code runs isolated. Every run is a fresh microVM: clone with a read-only token for one repository, install dependencies with the network on, cut the network before any test runs, then run the tests three times with no secrets inside.</title><style>@font-face{font-family:'AS Medium';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fb{font-family:'AS Medium',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:500;font-feature-settings:'tnum'}@font-face{font-family:'AS Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'AS Mono',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:400;font-feature-settings:'tnum'}@font-face{font-family:'AS Mono Semibold';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal}.fmb{font-family:'AS Mono Semibold',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:600;font-feature-settings:'tnum'}@font-face{font-family:'AS Regular';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fr{font-family:'AS Regular',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:400;font-feature-settings:'tnum'}@font-face{font-family:'AS Semibold';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal}.fs{font-family:'AS Semibold',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:600;font-feature-settings:'tnum'}
@media (prefers-reduced-motion:no-preference){
.fade{animation:fade .8s cubic-bezier(.22,1,.36,1) both}
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1s cubic-bezier(.22,1,.36,1) both}
.draw{stroke-dasharray:1;animation:draw 2.2s cubic-bezier(.45,0,.25,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
</style><defs><clipPath id="clip"><rect width="560" height="640" rx="24"/></clipPath><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.1" fill="#FFFFFF" fill-opacity=".07"/></pattern><radialGradient id="fade" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="dotmask"><rect width="560" height="640" fill="url(#fade)"/></mask></defs><g clip-path="url(#clip)"><rect width="560" height="640" fill="#08090C"/><rect width="560" height="640" fill="url(#dots)" mask="url(#dotmask)"/><text x="34.0" y="58.0" class="fmb" font-size="16" fill="#828A98" xml:space="preserve" letter-spacing="1.2">07</text><text x="70.0" y="58.0" class="fm" font-size="15" fill="#828A98" xml:space="preserve" letter-spacing="1.8">ISOLATION</text><g transform="translate(32,92)"><rect x="0.0" y="4.0" width="496.0" height="326.0" rx="16" fill="#0F1115" stroke="rgba(255,255,255,.14)"/><path d="M16.0,4.5H480.0" stroke="#FFFFFF" stroke-opacity=".05"/><g transform="translate(17.0,23.0) scale(0.9167)"><path d="M12 2.8 20.5 7.5v9L12 21.2 3.5 16.5v-9z" fill="none" stroke="#A9B0BC" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9.2" fill="none" stroke="#A9B0BC" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50.0" y="40.0" class="fs" font-size="17" fill="#EDEFF3" xml:space="preserve">Fresh microVM, one per run</text><circle cx="34" cy="92" r="16" fill="#16191F"/><g transform="translate(25.0,83.0) scale(0.7500)"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="#A9B0BC" stroke-width="2.33" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#A9B0BC" stroke-width="2.33" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="34" y1="110" x2="34" y2="132" stroke="rgba(255,255,255,.14)" stroke-width="2"/><text x="62.0" y="90.0" class="fb" font-size="16" fill="#EDEFF3" xml:space="preserve">Clone</text><text x="62.0" y="111.0" class="fr" font-size="14" fill="#828A98" xml:space="preserve">read-only token, one repository</text><circle cx="34" cy="150" r="16" fill="#16191F"/><g transform="translate(25.0,141.0) scale(0.7500)"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#A9B0BC" stroke-width="2.33" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 12h17M12 3.5c2.8 3 2.8 14 0 17M12 3.5c-2.8 3-2.8 14 0 17" fill="none" stroke="#A9B0BC" stroke-width="2.33" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="34" y1="168" x2="34" y2="190" stroke="rgba(255,255,255,.14)" stroke-width="2"/><text x="62.0" y="148.0" class="fb" font-size="16" fill="#EDEFF3" xml:space="preserve">Install dependencies</text><text x="62.0" y="169.0" class="fr" font-size="14" fill="#828A98" xml:space="preserve">network on</text><circle cx="34" cy="208" r="16" fill="rgba(255,122,69,.13)"/><g transform="translate(25.0,199.0) scale(0.7500)"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4" fill="none" stroke="#FF7A45" stroke-width="2.33" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="34" y1="226" x2="34" y2="248" stroke="rgba(255,255,255,.14)" stroke-width="2"/><text x="62.0" y="206.0" class="fb" font-size="16" fill="#EDEFF3" xml:space="preserve">Network cut</text><text x="62.0" y="227.0" class="fr" font-size="14" fill="#828A98" xml:space="preserve">before any test runs</text><circle cx="34" cy="266" r="16" fill="rgba(61,214,140,.12)"/><g transform="translate(25.0,257.0) scale(0.7500)"><path d="M13 3 5 13.5h6L10 21l9-11h-6z" fill="none" stroke="#3DD68C" stroke-width="2.33" stroke-linecap="round" stroke-linejoin="round"/></g><text x="62.0" y="264.0" class="fb" font-size="16" fill="#EDEFF3" xml:space="preserve">Run tests, three times</text><text x="62.0" y="285.0" class="fr" font-size="14" fill="#828A98" xml:space="preserve">no secrets inside</text><path d="M386,70 V191" stroke="#5EB1FF" stroke-width="2.4" stroke-linecap="round"/><path d="M386,225 V300" stroke="#828A98" stroke-opacity=".5" stroke-width="2.4" stroke-dasharray="2 7" stroke-linecap="round"/><g class="pop" style="animation-delay:.8s"><circle cx="386" cy="208" r="15" fill="rgba(255,122,69,.13)" stroke="#FF7A45" stroke-width="1.5"/><g transform="translate(379.0,201.0) scale(0.5833)"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="#FF7A45" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="412.0" y="76.0" class="fmb" font-size="11" fill="#5EB1FF" xml:space="preserve" letter-spacing="1.2">NETWORK</text><text x="412.0" y="213.0" class="fmb" font-size="11" fill="#FF7A45" xml:space="preserve" letter-spacing="1.2">CUT</text></g><line x1="34" y1="452" x2="526" y2="452" stroke="rgba(255,255,255,.08)"/><text x="32.0" y="516.0" class="fs" font-size="45" fill="#EDEFF3" xml:space="preserve" letter-spacing="-1.2">Your code runs isolated</text><text x="34.0" y="560.0" class="fr" font-size="20.5" fill="#A9B0BC" xml:space="preserve">Every run gets a fresh microVM. The network is cut</text><text x="34.0" y="594.0" class="fr" font-size="22" fill="#A9B0BC" xml:space="preserve">before tests run, and no secrets ever enter it.</text></g><rect x=".5" y=".5" width="559" height="639" rx="23.5" fill="none" stroke="rgba(255,255,255,.14)"/></svg>
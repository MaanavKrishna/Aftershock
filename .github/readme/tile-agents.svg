<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-label="05 Coding agents remember. An MCP server at /api/mcp: check_change with the files an agent edited returns INC-12, payment retry charged a customer twice, the behaviour to keep (one order, one charge) and the test that will run. Tools: check_change, list_lessons, get_incident, ask. Lessons also land in AGENTS.md and LESSONS.md."><title>05 Coding agents remember. An MCP server at /api/mcp: check_change with the files an agent edited returns INC-12, payment retry charged a customer twice, the behaviour to keep (one order, one charge) and the test that will run. Tools: check_change, list_lessons, get_incident, ask. Lessons also land in AGENTS.md and LESSONS.md.</title><style>@font-face{font-family:'AS Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'AS Mono',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:400;font-feature-settings:'tnum'}@font-face{font-family:'AS Mono Semibold';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal}.fmb{font-family:'AS Mono Semibold',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:600;font-feature-settings:'tnum'}@font-face{font-family:'AS Mono Medium';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fmm{font-family:'AS Mono Medium',ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:500;font-feature-settings:'tnum'}@font-face{font-family:'AS Regular';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fr{font-family:'AS Regular',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:400;font-feature-settings:'tnum'}@font-face{font-family:'AS Semibold';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal}.fs{font-family:'AS Semibold',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:600;font-feature-settings:'tnum'}
@media (prefers-reduced-motion:no-preference){
.fade{animation:fade .8s cubic-bezier(.22,1,.36,1) both}
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1s cubic-bezier(.22,1,.36,1) both}

e charge</text><text x="22.0" y="211.0" class="fm" font-size="15" fill="#828A98" xml:space="preserve">  test: test_inc_12_payment_retry.py</text><rect x="0.0" y="263.0" width="113.6" height="30.0" rx="6.0" fill="#16191F" stroke="rgba(255,255,255,.08)" stroke-width="1"/><text x="10.0" y="282.7" class="fm" font-size="13" fill="#A9B0BC" xml:space="preserve">check_change</text><rect x="121.6" y="263.0" width="113.6" height="30.0" rx="6.0" fill="#16191F" stroke="rgba(255,255,255,.08)" stroke-width="1"/><text x="131.6" y="282.7" class="fm" font-size="13" fill="#A9B0BC" xml:space="preserve">list_lessons</text><rect x="243.2" y="263.0" width="113.6" height="30.0" rx="6.0" fill="#16191F" stroke="rgba(255,255,255,.08)" stroke-width="1"/><text x="253.2" y="282.7" class="fm" font-size="13" fill="#A9B0BC" xml:space="preserve">get_incident</text><rect x="364.8" y="263.0" width="43.4" height="30.0" rx="6.0" fill="#16191F" stroke="rgba(255,255,255,.08)" stroke-width="1"/><text x="374.8" y="282.7" class="fm" font-size="13" fill="#A9B0BC" xml:space="preserve">ask</text><text x="0.0" y="334.0" class="fr" font-size="15" fill="#828A98" xml:space="preserve">+ lessons in AGENTS.md and LESSONS.md</text></g><line x1="34" y1="452" x2="526" y2="452" stroke="rgba(255,255,255,.08)"/><text x="32.0" y="516.0" class="fs" font-size="42" fill="#EDEFF3" xml:space="preserve" letter-spacing="-1.2">Coding agents remember</text><text x="34.0" y="560.0" class="fr" font-size="20" fill="#A9B0BC" xml:space="preserve">An MCP server answers before the change is made;</text><text x="34.0" y="594.0" class="fr" font-size="22" fill="#A9B0BC" xml:space="preserve">lessons sync into AGENTS.md by pull request.</text></g><rect x=".5" y=".5" width="559" height="639" rx="23.5" fill="none" stroke="rgba(255,255,255,.14)"/></svg>